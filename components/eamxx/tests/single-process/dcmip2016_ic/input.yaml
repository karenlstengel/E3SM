%YAML 1.1
---
driver_options:
  atmosphere_dag_verbosity_level: 5

time_stepping:
  time_step: ${ATM_TIME_STEP}
  run_t0: ${RUN_T0}  # YYYY-MM-DD-XXXXX
  number_of_steps: ${NUM_STEPS}

initial_conditions:
  # No 'filename' entry -- dcmip2016_baroclinic_wave_ic provides the ICs.
  # phis=0 is analytically correct for this flat-surface test.
  phis: 0.0

eamxx:
  atm_procs_list: [dcmip2016_baroclinic_wave_ic, homme]
  homme:
    moisture: moist

grids_manager:
  type: homme
  physics_grid_type: gll
  dynamics_namelist_file_name: namelist.nl
  vertical_coordinate_filename: ${SCREAM_DATA_DIR}/init/${EAMxx_tests_IC_FILE_72lev}

# The parameters for I/O control
scorpio:
  output_yaml_files: ["output.yaml"]
...
